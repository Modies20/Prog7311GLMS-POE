version: '3.8'

services:
  # SQL Server Database
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-server
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Password"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - glms-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong!Password -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 3s

  # GLMS Backend API
  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.API/Dockerfile
    container_name: glms-backend-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=GLMS_DB;User Id=sa;Password=YourStrong!Password;TrustServerCertificate=True;
      - Jwt__Key=GLMS-SecretKey-2026-Logistics-System-128-Bit-SecureKey!
      - Jwt__Issuer=GLMS
      - Jwt__Audience=GLMSClient
    ports:
      - "7001:8080"
    depends_on:
      sql-server-db:
        condition: service_healthy
    networks:
      - glms-network

  # GLMS Frontend MVC Web App
  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS/Dockerfile
    container_name: glms-frontend-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ApiUrl=http://glms-backend-api:8080/
    ports:
      - "7002:8080"
    depends_on:
      - glms-backend-api
    networks:
      - glms-network

volumes:
  sqlserver_data:

networks:
  glms-network:
    driver: bridge